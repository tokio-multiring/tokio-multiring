[package]
name = "sidecar-s3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An S3-style object server on tokio-sidecar and ureq-proto"
license = "MIT"
publish = false

[dependencies]
http = "1"
libc = "0.2"
log = "0.4"
tokio = { path = "../../tokio-uring-wl/tokio", features = ["macros", "rt-multi-thread", "sync", "time", "worker-local"] }
tokio-sidecar = { path = ".." }
# The server half of ureq-proto, from the fork branch that carries the
# HTTP/1.0 response framing and strict transfer-encoding changes.
ureq-proto = { git = "https://github.com/lthiery/ureq-proto", rev = "29bb65256f6a3854d52ca6c00a552b0c1da34be3", default-features = false, features = ["server"] }

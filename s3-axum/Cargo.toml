[package]
name = "s3-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unified Axum S3 server running on both standard Tokio (Hyper) and tokio-sidecar (io_uring)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
bytes = "1"
futures-core = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sidecar-axum = { path = "../sidecar-axum" }
subtle = "2"
tokio = { path = "../../tokio-uring-wl/tokio", features = ["fs", "io-uring", "io-util", "macros", "net", "rt-multi-thread", "sync", "time", "worker-local"] }
tokio-sidecar = { path = ".." }

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy & Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: "--cfg tokio_unstable -D warnings"
        run: cargo doc --workspace --no-deps

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Runner environment
        run: |
          uname -a
          nproc
          findmnt -T .
          ulimit -a

      - name: Mount polled scratch filesystem (null_blk)
        run: |
          if ! sudo modprobe null_blk nr_devices=1 gb=1 bs=4096 queue_mode=2 memory_backed=1 poll_queues=2; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe null_blk nr_devices=1 gb=1 bs=4096 queue_mode=2 memory_backed=1 poll_queues=2
          fi
          echo "nullb0 io_poll=$(cat /sys/block/nullb0/queue/io_poll)"
          sudo mkfs.ext4 -q /dev/nullb0
          mkdir -p target/tmp
          sudo mount /dev/nullb0 target/tmp
          sudo chown "$USER:$USER" target/tmp

      - name: Run workspace tests
        run: |
          sudo prlimit --pid=$$ --memlock=unlimited
          ulimit -l
          cargo test --workspace --no-fail-fast

      - name: Unmount polled scratch filesystem
        if: always()
        run: |
          if mountpoint -q target/tmp; then
            sudo umount target/tmp
          fi
          sudo modprobe -r null_blk || true

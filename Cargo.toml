[package]
name = "tokio-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Per-worker io_uring reactors running beside tokio's own I/O driver"
license = "MIT"
publish = false

[dependencies]
io-uring = "0.7.15"
libc = "0.2"
slab = "0.4"
# Worker-local tasks (`spawn_worker_local`, `run_on_each_worker`) are not in
# upstream tokio; this is the `local-worker-v3` branch of the fork.
tokio = { git = "https://github.com/lthiery/tokio", rev = "db6b53fcd31ab29594867dc44d04adecad5c82a8", features = ["rt-multi-thread", "net", "sync", "macros", "worker-local"] }

[dev-dependencies]
tokio = { git = "https://github.com/lthiery/tokio", rev = "db6b53fcd31ab29594867dc44d04adecad5c82a8", features = ["time"] }

[package]
name = "tokio-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Per-worker io_uring reactors running beside tokio's own I/O driver"
license = "MIT"
publish = false

[dependencies]
io-uring = "0.7.15"
libc = "0.2"
# Worker-local tasks (`spawn_worker_local`, `run_on_each_worker`) and the
# `on_before_steal` hook are not in upstream tokio; this is the
# `local-worker-v3-full` branch of the fork.
tokio = { git = "https://github.com/lthiery/tokio", rev = "0faaf1094b2ca4f27fc0a7a82de184f16ab707a6", features = ["rt-multi-thread", "net", "sync", "macros", "worker-local"] }

[dev-dependencies]
libc = "0.2"
tokio = { git = "https://github.com/lthiery/tokio", rev = "0faaf1094b2ca4f27fc0a7a82de184f16ab707a6", features = ["time"] }

[workspace]
members = ["s3"]
